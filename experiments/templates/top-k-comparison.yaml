template_key: top-k-comparison-v1
schema_version: "1.0"
name: Comparación de Top K
description: Analiza el impacto del número de contextos recuperados sobre calidad y latencia.
category: retrieval
tags:
  - retrieval
  - top-k
  - comparison

configuration:
  schema_version: "1.0"

  chunking:
    strategy: recursive
    chunk_size: 512
    chunk_overlap: 64

  embedding:
    provider: ollama
    model: nomic-embed-text

  retrieval:
    strategy: similarity
    top_k: 5

  generation:
    provider: ollama
    model: llama3.1
    temperature: 0.0

  evaluation:
    metrics:
      - faithfulness
      - answer_relevancy
      - context_precision
      - context_recall
      - latency_ms

matrix:
  retrieval.top_k:
    - 3
    - 5
    - 10
