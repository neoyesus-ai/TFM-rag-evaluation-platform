template_key: baseline-rag-v1
schema_version: "1.0"
name: Baseline RAG
description: Configuración de referencia para validar el pipeline experimental.
category: baseline
tags:
  - baseline
  - rag
  - reproducibilidad

configuration:
  schema_version: "1.0"

  chunking:
    strategy: recursive
    chunk_size: 512
    chunk_overlap: 64

  embedding:
    provider: ollama
    model: nomic-embed-text

  retrieval:
    strategy: similarity
    top_k: 5

  generation:
    provider: ollama
    model: llama3.1
    temperature: 0.0

  evaluation:
    metrics:
      - faithfulness
      - answer_relevancy
      - context_precision
      - context_recall
      - latency_ms
