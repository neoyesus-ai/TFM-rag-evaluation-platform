services:
  postgres:
    image: postgres:16-alpine
    container_name: tfm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tfm_net

  minio:
    image: minio/minio:latest
    container_name: tfm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tfm_net

  minio-init:
    image: minio/mc:latest
    container_name: tfm-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000
      \"$${MINIO_ROOT_USER}\"
      \"$${MINIO_ROOT_PASSWORD}\" &&
      mc mb --ignore-existing local/documents &&
      mc mb --ignore-existing local/mlflow-artifacts &&
      mc mb --ignore-existing local/evaluation-datasets &&
      mc ls local
      "
    networks:
      - tfm_net

  ollama:
    image: ollama/ollama:latest
    container_name: tfm-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_PORT}:11434"
    healthcheck:
      test:
        [
          "CMD",
          "ollama",
          "list"
        ]
      interval: 15s
      timeout: 10s
      retries: 20
    networks:
      - tfm_net

  chroma:
    image: chromadb/chroma:latest
    container_name: tfm-chroma
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "${CHROMA_PORT}:8000"
    networks:
      - tfm_net

  mlflow:
    build:
      context: ./mlflow
      dockerfile: Dockerfile
    container_name: tfm-mlflow
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      MLFLOW_SERVER_ALLOWED_HOSTS: ${MLFLOW_ALLOWED_HOSTS}
      MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: ${MLFLOW_CORS_ALLOWED_ORIGINS}
      GIT_PYTHON_REFRESH: quiet
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      - --artifacts-destination
      - s3://mlflow-artifacts
      - --serve-artifacts
      - --allowed-hosts
      - ${MLFLOW_ALLOWED_HOSTS}
      - --cors-allowed-origins
      - ${MLFLOW_CORS_ALLOWED_ORIGINS}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - tfm_net

  metabase:
    image: metabase/metabase:latest
    container_name: tfm-metabase
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      MB_DB_HOST: postgres
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://localhost:3000/api/health || exit 1"
        ]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    networks:
      - tfm_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tfm-backend
    restart: unless-stopped
    environment:
      APP_NAME: "TFM RAG Evaluation Platform"
      APP_VERSION: "0.1.0"
      ENVIRONMENT: development

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      CHROMA_HOST: chroma
      CHROMA_PORT: 8000

      OLLAMA_HOST: ollama
      OLLAMA_PORT: 11434

      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_DOCUMENTS: documents
      MINIO_SECURE: "false"

      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: tfm-rag-experiments

      MAX_UPLOAD_SIZE_MB: 25

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-480}

      AUTH_ADMIN_USERNAME: ${AUTH_ADMIN_USERNAME}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD}
      AUTH_ADMIN_FULL_NAME: ${AUTH_ADMIN_FULL_NAME}
      AUTH_ADMIN_EMAIL: ${AUTH_ADMIN_EMAIL:-}

    volumes:
      - ./experiments/templates:/app/experiment_templates:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama:
        condition: service_healthy
      chroma:
        condition: service_started
      mlflow:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - tfm_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tfm-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tfm_net

networks:
  tfm_net:
    name: tfm-rag-network
    driver: bridge

volumes:
  postgres_data:
    name: tfm-postgres-data

  minio_data:
    name: tfm-minio-data

  ollama_data:
    name: tfm-ollama-data

  chroma_data:
    name: tfm-chroma-data

  frontend_node_modules:
    name: tfm-frontend-node-modules