services:
  postgres:
    image: postgres:16-alpine
    container_name: tfm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tfm_net

  minio:
    image: minio/minio:latest
    container_name: tfm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tfm_net

  ollama:
    image: ollama/ollama:latest
    container_name: tfm-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_PORT}:11434"
    healthcheck:
      test:
        [
          "CMD",
          "ollama",
          "list"
        ]
      interval: 15s
      timeout: 10s
      retries: 20
    networks:
      - tfm_net

  chroma:
    image: chromadb/chroma:latest
    container_name: tfm-chroma
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "${CHROMA_PORT}:8000"
    networks:
      - tfm_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tfm-backend
    restart: unless-stopped
    environment:
      APP_NAME: "TFM RAG Evaluation Platform"
      APP_VERSION: "0.1.0"
      ENVIRONMENT: "development"

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      CHROMA_HOST: chroma
      CHROMA_PORT: 8000

      OLLAMA_HOST: ollama
      OLLAMA_PORT: 11434

      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama:
        condition: service_healthy
      chroma:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - tfm_net

networks:
  tfm_net:
    name: tfm-rag-network
    driver: bridge

volumes:
  postgres_data:
    name: tfm-postgres-data

  minio_data:
    name: tfm-minio-data

  ollama_data:
    name: tfm-ollama-data

  chroma_data:
    name: tfm-chroma-data
